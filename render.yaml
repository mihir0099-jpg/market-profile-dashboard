# Render 1-click build trigger for Market Profile Dashboard
services:
  - type: web
    name: market-profile-dashboard
    env: node
    plan: free
    buildCommand: "npm install && npm install --prefix backend && npm install --prefix frontend --legacy-peer-deps && npm run build --prefix frontend"
    startCommand: "npm start --prefix backend"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
